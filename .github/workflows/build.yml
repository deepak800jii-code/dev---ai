          cat > app/src/main/java/com/example/personalai/Actions.kt <<'EOF_PAI'
          package com.example.personalai

          import android.Manifest
          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.provider.AlarmClock
          import android.provider.ContactsContract
          import android.view.KeyEvent
          import org.json.JSONObject

          object Actions {
              // Basic safety: payment / banking style apps par kaam nahi karega.
              private val BLOCKED_WORDS = listOf(
                  "paisa", "phonepe", "paytm", "upi", "bhim", "bank", "wallet",
                  "paypal", "razorpay", "mobikwik", "freecharge", "amazonpay"
              )

              fun isBlocked(pkg: String): Boolean {
                  val p = pkg.lowercase()
                  return BLOCKED_WORDS.any { p.contains(it) }
              }

              fun execute(ctx: Context, name: String, a: JSONObject): String = when (name) {
                  "open_app" -> openApp(ctx, a.getString("app_name"))
                  "call" -> call(ctx, a.getString("contact_or_number"))
                  "set_alarm" -> setAlarm(ctx, a.getInt("hour"), a.getInt("minute"), a.optString("label", ""))
                  "set_timer" -> setTimer(ctx, a.getInt("seconds"), a.optString("label", ""))
                  "flashlight" -> flashlight(ctx, a.getBoolean("on"))
                  "volume" -> volume(ctx, a.getString("action"))
                  "media" -> media(ctx, a.getString("action"))
                  "system_action" -> systemAction(a.getString("action"))
                  "read_screen" -> withAcc { it.readScreen() }
                  "click_text" -> withAcc { if (it.clickText(a.getString("text"))) "clicked" else "not found or blocked" }
                  "type_text" -> withAcc { if (it.typeText(a.getString("text"))) "typed" else "no editable field focused" }
                  "scroll" -> withAcc { if (it.scroll(a.getString("direction"))) "scrolled" else "cannot scroll" }
                  else -> "unknown tool"
              }

              private fun withAcc(f: (PhoneControlService) -> String): String {
                  val s = PhoneControlService.instance ?: return "Accessibility service chalu nahi hai"
                  return f(s)
              }

              private fun start(ctx: Context, i: Intent) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val c: Context = PhoneControlService.instance ?: ctx
                  c.startActivity(i)
              }

              private fun openApp(ctx: Context, name: String): String {
                  val pm = ctx.packageManager
                  val q = name.lowercase().trim()
                  val apps = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                  val match = apps.firstOrNull { it.loadLabel(pm).toString().lowercase() == q }
                      ?: apps.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(q) }
                      ?: return "app nahi mila: $name"
                  val pkg = match.activityInfo.packageName
                  if (isBlocked(pkg)) return "Ye app safety ke liye blocked hai"
                  val li = pm.getLaunchIntentForPackage(pkg) ?: return "app khol nahi sakta"
                  start(ctx, li)
                  return "opened " + match.loadLabel(pm)
              }

              private fun findContact(ctx: Context, name: String): String? {
                  val c = ctx.contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(ContactsContract.CommonDataKinds.Phone.NUMBER),
                      ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?",
                      arrayOf("%$name%"), null
                  ) ?: return null
                  var result: String? = null
                  c.use { if (it.moveToFirst()) result = it.getString(0) }
                  return result
              }

              private fun call(ctx: Context, target: String): String {
                  var number = target.filter { it.isDigit() || it == '+' }
                  if (number.length < 5) {
                      if (ctx.checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED)
                          return "contacts permission nahi hai"
                      number = findContact(ctx, target.trim()) ?: return "contact nahi mila: $target"
                  }
                  if (ctx.checkSelfPermission(Manifest.permission.CALL_PHONE) != PackageManager.PERMISSION_GRANTED)
                      return "call permission nahi hai"
                  start(ctx, Intent(Intent.ACTION_CALL, Uri.parse("tel:" + Uri.encode(number))))
                  return "calling $number"
              }

              private fun setAlarm(ctx: Context, h: Int, m: Int, label: String): String {
                  val i = Intent(AlarmClock.ACTION_SET_ALARM)
                      .putExtra(AlarmClock.EXTRA_HOUR, h)
                      .putExtra(AlarmClock.EXTRA_MINUTES, m)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, label)
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  start(ctx, i)
                  return "alarm set for $h:$m"
              }

              private fun setTimer(ctx: Context, sec: Int, label: String): String {
                  val i = Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, sec)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, label)
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  start(ctx, i)
                  return "timer set for $sec seconds"
              }

              private fun flashlight(ctx: Context, on: Boolean): String {
                  val cm = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                  val id = cm.cameraIdList.firstOrNull {
                      cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                  } ?: return "flashlight nahi mili"
                  cm.setTorchMode(id, on)
                  return if (on) "torch on" else "torch off"
              }

              private fun volume(ctx: Context, action: String): String {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val s = AudioManager.STREAM_MUSIC
                  when (action) {
                      "up" -> am.adjustStreamVolume(s, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                      "down" -> am.adjustStreamVolume(s, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                      "max" -> am.setStreamVolume(s, am.getStreamMaxVolume(s), AudioManager.FLAG_SHOW_UI)
                      "mute" -> am.adjustStreamVolume(s, AudioManager.ADJUST_MUTE, AudioManager.FLAG_SHOW_UI)
                      "unmute" -> am.adjustStreamVolume(s, AudioManager.ADJUST_UNMUTE, AudioManager.FLAG_SHOW_UI)
                      else -> return "unknown volume action"
                  }
                  return "ok"
              }

              private fun media(ctx: Context, action: String): String {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val code = when (action) {
                      "play_pause" -> KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE
                      "next" -> KeyEvent.KEYCODE_MEDIA_NEXT
                      "previous" -> KeyEvent.KEYCODE_MEDIA_PREVIOUS
                      else -> return "unknown media action"
                  }
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
                  return "ok"
              }

              private fun systemAction(action: String): String {
                  val s = PhoneControlService.instance ?: return "Accessibility service chalu nahi hai"
                  val g = when (action) {
                      "home" -> AccessibilityService.GLOBAL_ACTION_HOME
                      "back" -> AccessibilityService.GLOBAL_ACTION_BACK
                      "recents" -> AccessibilityService.GLOBAL_ACTION_RECENTS
                      "notifications" -> AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS
                      "lock_screen" -> AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN
                      "screenshot" -> AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT
                      else -> return "unknown system action"
                  }
                  return if (s.performGlobalAction(g)) "done" else "failed"
              }
          }
