          package com.example.personalai

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class PhoneControlService : AccessibilityService() {
              companion object {
                  @Volatile
                  var instance: PhoneControlService? = null
              }

              override fun onServiceConnected() {
                  instance = this
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              private fun rootOrNull(): AccessibilityNodeInfo? {
                  val r = rootInActiveWindow ?: return null
                  if (Actions.isBlocked(r.packageName?.toString() ?: "")) return null
                  return r
              }

              fun readScreen(): String {
                  val root = rootInActiveWindow ?: return "screen padh nahi paya"
                  if (Actions.isBlocked(root.packageName?.toString() ?: "")) return "Ye app safety ke liye blocked hai"
                  val out = StringBuilder()
                  var count = 0
                  fun walk(n: AccessibilityNodeInfo?) {
                      if (n == null || count > 80) return
                      val t = (n.text?.toString() ?: n.contentDescription?.toString() ?: "").trim()
                      if (t.isNotEmpty() && !n.isPassword) {
                          out.append(t)
                          if (n.isClickable) out.append(" [click]")
                          out.append('\n')
                          count++
                      }
                      for (i in 0 until n.childCount) walk(n.getChild(i))
                  }
                  walk(root)
                  return if (out.isEmpty()) "kuch text nahi dikha" else out.toString().take(3000)
              }

              fun clickText(t: String): Boolean {
                  val root = rootOrNull() ?: return false
                  for (n in root.findAccessibilityNodeInfosByText(t)) {
                      var cur: AccessibilityNodeInfo? = n
                      while (cur != null) {
                          if (cur.isClickable) return cur.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                          cur = cur.parent
                      }
                  }
                  return false
              }

              fun typeText(t: String): Boolean {
                  val root = rootOrNull() ?: return false
                  val f = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: return false
                  if (f.isPassword) return false
                  val args = Bundle()
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, t)
                  return f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
              }

              fun scroll(direction: String): Boolean {
                  val root = rootOrNull() ?: return false
                  val node = findScrollable(root) ?: return false
                  val action = if (direction == "up") AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD
                  else AccessibilityNodeInfo.ACTION_SCROLL_FORWARD
                  return node.performAction(action)
              }

              private fun findScrollable(n: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  if (n.isScrollable) return n
                  for (i in 0 until n.childCount) {
                      val c = n.getChild(i) ?: continue
                      val r = findScrollable(c)
                      if (r != null) return r
                  }
                  return null
              }
          }
