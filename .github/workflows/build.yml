                  root.addView(button("à¤¨à¤¾à¤® à¤¸à¤¿à¤–à¤¾à¤“ (à¤¬à¤Ÿà¤¨ à¤¦à¤¬à¤¾à¤•à¤° à¤¸à¤¿à¤°à¥à¤«à¤¼ à¤¨à¤¾à¤® à¤¬à¥‹à¤²à¥‹)") { learnName() })
                  root.addView(button("à¤¸à¤¿à¤–à¤¾à¤ à¤¹à¥à¤ à¤°à¥‚à¤ª à¤®à¤¿à¤Ÿà¤¾à¤“") {
                      Prefs.clearLearned(this)
                      Toast.makeText(this, "à¤®à¤¿à¤Ÿà¤¾ à¤¦à¤¿à¤", Toast.LENGTH_SHORT).show()
