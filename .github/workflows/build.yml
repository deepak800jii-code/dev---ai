                  if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  val missing = perms.filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isEmpty()) startAssistant() else requestPermissions(missing.toTypedArray(), 1)
              }

              private fun startAssistant() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Microphone permission à¤œà¤¼à¤°à¥‚à¤°à¥€ à¤¹à¥ˆ", Toast.LENGTH_LONG).show()
                      return
                  }
                  startForegroundService(Intent(this, AssistantService::class.java))
                  Toast.makeText(this, "à¤šà¤¾à¤²à¥‚ à¤¹à¥‹ à¤—à¤¯à¤¾à¥¤ ${Prefs.aiName(this)} à¤•à¤¹à¤•à¤° à¤¬à¥à¤²à¤¾à¤“à¥¤", Toast.LENGTH_LONG).show()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 1) {
                      startAssistant()
                  } else if (requestCode == 2 && grantResults.firstOrNull() == PackageManager.PERMISSION_GRANTED) {
                      learnName()
                  }
              }

              override fun onDestroy() {
                  learner?.destroy()
                  super.onDestroy()
              }
          }
          EOF_PAI
          mkdir -p app/src/main/java/com/example/personalai
          cat > app/src/main/java/com/example/personalai/AssistantService.kt <<'EOF_PAI'
          package com.example.personalai

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors

          class AssistantService : Service(), TextToSpeech.OnInitListener {
              companion object {
                  private const val CHANNEL = "assistant"
                  private val STOP_WORDS = listOf("alvida", "अलविदा", "bye bye", "बाय बाय", "sleep mode")
              }

              private val main = Handler(Looper.getMainLooper())
              private val worker = Executors.newSingleThreadExecutor()
              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var running = false
              private var busy = false

              @Volatile
              private var awaitingCommand = false
              private var wakeLock: PowerManager.WakeLock? = null
              private val history = ArrayList<JSONObject>()

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (running) return START_STICKY
                  running = true
                  createChannel()
                  val n = buildNotice("नाम लेकर बुलाइए")
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "personalai:listen").apply { acquire() }
                  tts = TextToSpeech(this, this)
                  return START_STICKY
              }

              override fun onDestroy() {
                  running = false
                  main.removeCallbacksAndMessages(null)
                  recognizer?.destroy()
                  recognizer = null
                  tts?.stop()
                  tts?.shutdown()
                  tts = null
                  worker.shutdownNow()
                  wakeLock?.let { if (it.isHeld) it.release() }
                  super.onDestroy()
              }

              // ---------- Notification ----------
              private fun createChannel() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CHANNEL, "Assistant", NotificationManager.IMPORTANCE_LOW))
              }

              private fun buildNotice(text: String): Notification {
                  val open = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  return Notification.Builder(this, CHANNEL)
                      .setContentTitle(Prefs.aiName(this) + " सुन रहा है")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(open)
                      .setOngoing(true)
                      .build()
              }

              private fun notice(text: String) {
                  getSystemService(NotificationManager::class.java).notify(1, buildNotice(text))
              }

              // ---------- Voice out ----------
              override fun onInit(status: Int) {
                  if (status != TextToSpeech.SUCCESS) {
                      ttsReady = false
                      startListening()
                      return
                  }
                  val t = tts ?: return
                  val r = t.setLanguage(Locale("hi", "IN"))
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                      t.setLanguage(Locale("en", "IN"))
                  }
                  t.setSpeechRate(Prefs.rate(this))
                  t.setPitch(Prefs.pitch(this))
                  t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {}
                      override fun onDone(utteranceId: String?) {
                          main.post { busy = false; startListening() }
                      }

                      @Deprecated("Deprecated in Java")
                      override fun onError(utteranceId: String?) {
                          main.post { busy = false; startListening() }
                      }
                  })
                  ttsReady = true
                  speak("नमस्ते, मैं ${Prefs.aiName(this)} हूँ। मुझे मेरा नाम लेकर बुलाइए।")
              }

              private fun speak(text: String) {
                  main.post {
                      if (!running) return@post
                      val t = tts
                      if (!ttsReady || t == null) {
                          busy = false
                          startListening()
                          return@post
                      }
                      busy = true
                      recognizer?.destroy()
                      recognizer = null
                      t.speak(text, TextToSpeech.QUEUE_FLUSH, null, "u" + System.nanoTime())
                  }
              }

              // ---------- Voice in ----------
              private val listener = object : RecognitionListener {
                  override fun onReadyForSpeech(params: Bundle?) {}
                  override fun onBeginningOfSpeech() {}
                  override fun onRmsChanged(rmsdB: Float) {}
                  override fun onBufferReceived(buffer: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onPartialResults(partialResults: Bundle?) {}
                  override fun onEvent(eventType: Int, params: Bundle?) {}

                  override fun onError(error: Int) {
                      if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                          stopSelf()
                          return
                      }
                      main.postDelayed({ startListening() }, 600)
                  }

                  override fun onResults(results: Bundle?) {
                      val text = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull().orEmpty()
                      if (text.isBlank()) main.postDelayed({ startListening() }, 300) else onHeard(text)
                  }
              }

              private fun startListening() {
                  main.post {
                      if (!running || busy) return@post
                      if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                          Toast.makeText(this, "Speech recognition नहीं मिला (Google app चाहिए)", Toast.LENGTH_LONG).show()
                          return@post
                      }
                      recognizer?.destroy()
                      val r = SpeechRecognizer.createSpeechRecognizer(this)
                      r.setRecognitionListener(listener)
                      recognizer = r
                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN")
                          .putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                      r.startListening(i)
                  }
              }

              private fun onHeard(text: String) {
                  notice("सुना: $text")
                  val lower = text.lowercase()
                  val names = Prefs.names(this)
                  val hit = names.any { lower.contains(it) }
                  if (!hit && !awaitingCommand) {
                      startListening()
                      return
                  }
                  var cmd = lower
                  for (n in names) cmd = cmd.replace(n, "")
                  cmd = cmd.trim(' ', ',', '.', '?', '!', '।')
                  awaitingCommand = false
                  if (cmd.isEmpty()) {
                      awaitingCommand = true
                      speak("जी, बोलिए।")
                      return
                  }
                  if (STOP_WORDS.any { cmd.contains(it) }) {
                      speak("ठीक है, फिर मिलते हैं।")
                      main.postDelayed({ stopSelf() }, 4000)
                      return
                  }
                  busy = true
                  worker.execute {
                      val answer = try {
                          ask(cmd)
                      } catch (e: Exception) {
                          val m = e.message ?: ""
                          when {
                              m.contains("API key not valid") || m.contains("API_KEY_INVALID") -> "API key गलत लग रही है।"
                              m.contains("429") -> "अभी की free limit पूरी हो गई है, थोड़ी देर बाद कोशिश कीजिए।"
                              m.contains("503") || m.contains("500") -> "अभी Gemini व्यस्त है, थोड़ी देर बाद कोशिश कीजिए।"
                              m.contains("404") -> "मॉडल का नाम सही नहीं है, app में मॉडल बदलिए।"
                              else -> "इंटरनेट या API में दिक्कत है।"
                          }
                      }
                      if (answer.contains("?")) awaitingCommand = true
                      speak(answer)
                  }
              }

              // ---------- Gemini ----------
              private fun systemPrompt(): String {
                  val now = SimpleDateFormat("EEEE, d MMMM yyyy, HH:mm", Locale("en", "IN")).format(Date())
                  val name = Prefs.aiName(this)
                  return "Tumhara naam $name hai. Tum user ke Android phone me chalne wale voice assistant ho. " +
                      "Abhi ka samay: $now. " +
                      "Jawab user ki bhasha me do; Hindi ho to Devanagari me likho taaki awaaz sahi bole. " +
                      "Jawab bolne ke liye hain: 1-3 chhote vakya, koi markdown, list ya emoji nahi. " +
                      "Taaza khabar ya current jankari ke liye web_search tool use karo. " +
                      "Phone ka kaam tools se karo. Screen par kuch karne se pehle read_screen se dekho ki kya dikh raha hai. " +
                      "Koi bhi aisa kaam jo wapas nahi hota (call karna, message bhejna, kuch delete ya post karna) " +
                      "karne se pehle user se chhota haan/na ka sawaal poochho (sawaal ? par khatam karo) aur sirf haan milne par karo. " +
                      "Payment, banking, UPI, OTP ya password se jude kaam kabhi mat karo, aur kisi ka OTP ya password bolkar mat sunao."
              }

              private fun msg(role: String, text: String) =
                  JSONObject().put("role", role).put("parts", JSONArray().put(JSONObject().put("text", text)))

              private fun ask(question: String): String {
                  val key = Prefs.apiKey(this)
                  if (key.isBlank()) return "पहले app में Gemini API key डालिए।"
                  val model = Prefs.model(this)
                  val contents = JSONArray()
                  history.forEach { contents.put(it) }
                  contents.put(msg("user", question))
                  var answer = ""
                  for (step in 0 until 8) {
                      val body = JSONObject()
                          .put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", systemPrompt()))))
                          .put("contents", contents)
                          .put("tools", Gemini.tools())
                      val resp = Gemini.post(key, model, body)
                      val content = resp.optJSONArray("candidates")?.optJSONObject(0)?.optJSONObject("content")
                      val parts = content?.optJSONArray("parts")
                      if (content == null || parts == null || parts.length() == 0) {
                          answer = "इस बार जवाब नहीं मिल पाया, दोबारा बोलिए।"
                          break
                      }
                      if (!content.has("role")) content.put("role", "model")
                      contents.put(content)

                      val calls = ArrayList<JSONObject>()
                      val sb = StringBuilder()
                      for (i in 0 until parts.length()) {
                          val p = parts.getJSONObject(i)
                          if (p.has("functionCall")) {
                              calls.add(p.getJSONObject("functionCall"))
                          } else if (p.has("text") && !p.optBoolean("thought", false)) {
                              sb.append(p.optString("text"))
                          }
                      }
                      if (calls.isEmpty()) {
                          answer = sb.toString().trim()
                          break
                      }
                      val responses = JSONArray()
                      for (c in calls) {
                          val name = c.getString("name")
                          val args = c.optJSONObject("args") ?: JSONObject()
                          val out = try {
                              if (name == "web_search") Gemini.search(key, model, args.optString("query"))
                              else Actions.execute(this, name, args)
                          } catch (e: Exception) {
                              "error: " + e.message
                          }
                          val fr = JSONObject().put("name", name).put("response", JSONObject().put("result", out))
                          if (c.has("id")) fr.put("id", c.getString("id"))
                          responses.put(JSONObject().put("functionResponse", fr))
                      }
                      contents.put(JSONObject().put("role", "user").put("parts", responses))
                  }
                  if (answer.isEmpty()) answer = "हो गया।"
                  history.add(msg("user", question))
                  history.add(msg("model", answer))
                  while (history.size > 20) history.removeAt(0)
                  return answer
              }
          }
