          package com.example.personalai

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          object Gemini {
              private const val BASE = "https://generativelanguage.googleapis.com/v1beta/models/"

              @Volatile
              private var thinkingOk = true

              private fun rawPost(key: String, model: String, body: JSONObject): JSONObject {
                  val c = URL(BASE + model + ":generateContent").openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 20000
                  c.readTimeout = 90000
                  c.setRequestProperty("x-goog-api-key", key)
                  c.setRequestProperty("Content-Type", "application/json")
                  c.doOutput = true
                  c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                  val code = c.responseCode
                  val stream = if (code in 200..299) c.inputStream else c.errorStream
                  val text = stream?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                  if (code !in 200..299) throw RuntimeException("API $code: $text")
                  return JSONObject(text)
              }

              // Gemini 3 models ke liye "low" thinking (jaldi jawab). Agar server mana kare to bina uske dobara try.
              fun post(key: String, model: String, body: JSONObject): JSONObject {
                  val wantThinking = thinkingOk && model.startsWith("gemini-3")
                  if (wantThinking) {
                      body.put(
                          "generationConfig",
                          JSONObject().put("thinkingConfig", JSONObject().put("thinkingLevel", "low"))
                      )
                  } else {
                      body.remove("generationConfig")
                  }
                  try {
                      return rawPost(key, model, body)
                  } catch (e: RuntimeException) {
                      val m = e.message ?: ""
                      if (wantThinking && m.contains("API 400") && m.contains("think", ignoreCase = true)) {
                          thinkingOk = false
                          body.remove("generationConfig")
                          return rawPost(key, model, body)
                      }
                      throw e
                  }
              }

              private fun textParts(t: String) =
                  JSONObject().put("parts", JSONArray().put(JSONObject().put("text", t)))

              // Google Search se taaza jankari (alag request, sirf search tool ke saath)
              fun search(key: String, model: String, query: String): String {
                  val body = JSONObject()
                      .put("systemInstruction", textParts("Taaza jankari ke saath 4-5 chhote vakya me jawab do. Hindi me likho."))
                      .put(
                          "contents",
                          JSONArray().put(
                              JSONObject().put("role", "user")
                                  .put("parts", JSONArray().put(JSONObject().put("text", query)))
                          )
                      )
                      .put("tools", JSONArray().put(JSONObject().put("google_search", JSONObject())))
                  val resp = post(key, model, body)
                  val parts = resp.optJSONArray("candidates")?.optJSONObject(0)
                      ?.optJSONObject("content")?.optJSONArray("parts") ?: return "kuch nahi mila"
                  val sb = StringBuilder()
                  for (i in 0 until parts.length()) sb.append(parts.getJSONObject(i).optString("text"))
                  val out = sb.toString().trim()
                  return if (out.isEmpty()) "kuch nahi mila" else out
              }

              private fun str(d: String) = JSONObject().put("type", "STRING").put("description", d)
              private fun int(d: String) = JSONObject().put("type", "INTEGER").put("description", d)
              private fun bool(d: String) = JSONObject().put("type", "BOOLEAN").put("description", d)
              private fun opts(d: String, vararg v: String) =
                  JSONObject().put("type", "STRING").put("description", d).put("enum", JSONArray(v.toList()))

              private fun fn(name: String, desc: String, props: JSONObject? = null, req: List<String> = emptyList()): JSONObject {
                  val o = JSONObject().put("name", name).put("description", desc)
                  if (props != null) {
                      val p = JSONObject().put("type", "OBJECT").put("properties", props)
                      if (req.isNotEmpty()) p.put("required", JSONArray(req))
                      o.put("parameters", p)
                  }
                  return o
              }

              fun tools(): JSONArray {
                  val d = JSONArray()
                  d.put(fn("web_search", "Search Google for current news and up-to-date facts.",
                      JSONObject().put("query", str("Search query")), listOf("query")))    
                  d.put(fn("open_app", "Open an installed app by its name (e.g. WhatsApp, YouTube, Camera, Settings).",
                      JSONObject().put("app_name", str("App name as shown on the phone")), listOf("app_name")))
                  d.put(fn("call", "Place a phone call to a saved contact name or a phone number. Use only after the user confirmed.",
                      JSONObject().put("contact_or_number", str("Contact name or number")), listOf("contact_or_number")))
                  d.put(fn("set_alarm", "Set an alarm at a time of day.",
                      JSONObject().put("hour", int("0-23")).put("minute", int("0-59")).put("label", str("Optional label")),
                      listOf("hour", "minute")))
                  d.put(fn("set_timer", "Start a countdown timer.",
                      JSONObject().put("seconds", int("Duration in seconds")).put("label", str("Optional label")),
                      listOf("seconds")))
                  d.put(fn("flashlight", "Turn the flashlight on or off.",
                      JSONObject().put("on", bool("true = on")), listOf("on")))
                  d.put(fn("volume", "Change media volume.",
                      JSONObject().put("action", opts("Volume action", "up", "down", "max", "mute", "unmute")), listOf("action")))
                  d.put(fn("media", "Control music or video playback.",
                      JSONObject().put("action", opts("Playback action", "play_pause", "next", "previous")), listOf("action")))
                  d.put(fn("system_action", "Press a system button or do a system gesture.",
                      JSONObject().put("action", opts("Action", "home", "back", "recents", "notifications", "lock_screen", "screenshot")),
                      listOf("action")))
                  d.put(fn("read_screen", "Read the visible text on the current screen. Items marked [click] are tappable."))
                  d.put(fn("click_text", "Tap the on-screen element that contains this text.",
                      JSONObject().put("text", str("Visible text of the element")), listOf("text")))
                  d.put(fn("type_text", "Type text into the currently focused input field (replaces its content).",
                      JSONObject().put("text", str("Text to type")), listOf("text")))
                  d.put(fn("scroll", "Scroll the current screen.",
                      JSONObject().put("direction", opts("Direction", "up", "down")), listOf("direction")))
                  return JSONArray().put(JSONObject().put("functionDeclarations", d))
              }
          }
