                  })

                  root.addView(label("5. à¤…à¤¬ à¤šà¤¾à¤²à¥‚ à¤•à¤°à¥‹"))
                  root.addView(button("START (à¤¸à¥à¤¨à¤¨à¤¾ à¤¶à¥à¤°à¥‚ à¤•à¤°à¥‹)") { saveAndStart() })
                  root.addView(button("STOP") {
